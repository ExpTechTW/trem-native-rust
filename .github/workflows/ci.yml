name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI runners have no GPU worth comparing pictures on; the apps' pictures are checked on a Mac.
  TREM_SKIP_PICTURES: "1"

jobs:
  lint:
    name: fmt, clippy, doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libdbus-1-dev libfontconfig1-dev clang
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      # The fonts: the text tests check that characters missing from the embedded subset
      # come from the system's fonts, and a bare runner has no CJK or math font.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libdbus-1-dev libfontconfig1-dev clang fonts-noto-cjk fonts-noto-core
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: cargo test --workspace --all-features
